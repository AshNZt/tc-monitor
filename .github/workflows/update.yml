name: Update TermRadar data

on:
  schedule:
    # Twice a day: if GitHub delays or skips one scheduled run, the next one catches up.
    - cron: "17 6 * * *"    # every day at 06:17 UTC
    - cron: "17 18 * * *"   # every day at 18:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      send_digest:
        description: "Also send the weekly email now (for testing)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "sources.yaml", ".github/workflows/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build data from Open Terms Archive
        run: python scripts/build.py

      - name: Build RSS feed
        run: python scripts/digest.py feed

      - name: Check the data and the site before publishing
        run: |
          python scripts/check.py
          node --check site/app.js

      - name: Commit updated data
        run: |
          # commits are made in the name of the repository owner, so the owner is the only contributor
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add site/data site/feed.xml
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Data update $(date -u +%F)"
          # someone may have pushed during the run: replay our data commit on top and retry
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed, retrying in 15 seconds"
            sleep 15
          done
          echo "Could not push the data commit after 3 attempts"
          exit 1

      - name: Is this the weekly run? (first scheduled run on Monday)
        id: weekly
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt 12 ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a weekly issue with the changes of the last 7 days
        if: steps.weekly.outputs.yes == 'true'
        continue-on-error: true   # a failed alert must not block publishing the site
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/notify.py 7 "$SITE" > /tmp/body.md
          if [ -s /tmp/body.md ]; then
            gh issue create --title "TermRadar: changes of the week, $(date -u +%F)" --body-file /tmp/body.md
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send the weekly email digest
        if: steps.weekly.outputs.yes == 'true' || inputs.send_digest == true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/digest.py email
