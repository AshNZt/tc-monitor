# Documents to monitor.
# Data comes from Open Terms Archive (https://opentermsarchive.org), which
# downloads and archives these documents several times a day.
#
# Each platform lists one or more "services". A service is a folder in an
# Open Terms Archive "versions" repository. By default every document of the
# service is tracked; add `documents: [...]` to a service to limit it.
#
# Example of a service with its own repository and a document filter:
#   services:
#     - name: Facebook
#       repo: https://github.com/OpenTermsArchive/pga-versions
#       documents: [Terms of Service, Privacy Policy]

platforms:
  - id: openai
    name: OpenAI
    monogram: OA
    color: "#4e8f80"
    repo: https://github.com/OpenTermsArchive/GenAI-versions
    services: [ChatGPT]

  - id: anthropic
    name: Anthropic
    monogram: AN
    color: "#b07c62"
    repo: https://github.com/OpenTermsArchive/GenAI-versions
    services: [Claude.ai]

  - id: google
    name: Google
    monogram: GO
    color: "#6387b7"
    repo: https://github.com/OpenTermsArchive/GenAI-versions
    services: [Google Generative AI Services]

  - id: meta
    name: Meta
    monogram: ME
    color: "#9b72a6"
    repo: https://github.com/OpenTermsArchive/pga-versions
    services: [Facebook, Instagram, WhatsApp, Threads]

  - id: apple
    name: Apple
    monogram: AP
    color: "#7d8a9a"
    repo: https://github.com/OpenTermsArchive/contrib-versions
    services: [Apple, App Store, iCloud]

settings:
  # Shown in the footer of the site
  author: Alessandro Morigi
  author_url: https://github.com/AshNZt
  # Warn on the dashboard if a source has not recorded anything for this many days
  stale_after_days: 21
